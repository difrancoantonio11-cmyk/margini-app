<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Margini">
<meta name="theme-color" content="#2340D8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Margini</title>
<style>
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --surface-2:#F5F6F8; --ink:#14171C; --ink-2:#5A6270; --ink-3:#8A929E;
  --line:#D9DDE3; --accent:#2340D8; --accent-ink:#FFFFFF; --accent-soft:#E3E8FF;
  --danger:#C2255C; --paper:#FFFFFF;
  --hl-yellow:#FFD43B; --hl-green:#4CD98A; --hl-blue:#5AB4FA; --hl-pink:#FF7AB8;
  --shadow:0 8px 28px rgba(20,23,28,.14); --shadow-s:0 2px 8px rgba(20,23,28,.08);
  --r:14px; --bar:56px;
  --sans:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --serif:"New York","Iowan Old Style",Georgia,serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101216; --surface:#1A1D23; --surface-2:#22262D; --ink:#E7EAEE; --ink-2:#9AA3AF; --ink-3:#6C7480;
    --line:#2E333B; --accent:#8EA2FF; --accent-ink:#0B1030; --accent-soft:#232B4D; --danger:#FF6B9A;
    --shadow:0 8px 28px rgba(0,0,0,.5); --shadow-s:0 2px 8px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

.view{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:6px;min-height:calc(var(--bar) + var(--st));padding:var(--st) calc(10px + var(--sr)) 0 calc(10px + var(--sl));background:var(--surface);border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;z-index:5}
.bar h1{font-size:20px;margin:0 8px 0 6px;letter-spacing:-.01em}
.bar .title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink)}
.ib:active,.ib.on{background:var(--accent-soft);color:var(--accent)}
.btn{height:40px;padding:0 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.97)}
.spacer{flex:1}
.pill{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;font-variant-numeric:tabular-nums}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{height:34px;padding:0 14px;border-radius:9px;font-weight:600;color:var(--ink-2);font-size:15px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}

.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.pad{padding:18px calc(16px + var(--sr)) calc(28px + var(--sb)) calc(16px + var(--sl))}

/* libreria */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.cover{aspect-ratio:3/4.2;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-s);overflow:hidden;display:grid;place-items:center;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .ph{padding:14px;font:600 15px/1.25 var(--serif);color:var(--ink-2);text-align:center;word-break:break-word}
.cover .tag{position:absolute;left:8px;bottom:8px;font:700 10px var(--sans);letter-spacing:.08em;background:var(--ink);color:var(--surface);padding:3px 6px;border-radius:5px}
.card .t{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--ink-3)}
.card .more{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);display:grid;place-items:center;box-shadow:var(--shadow-s)}
.empty{max-width:440px;margin:12vh auto 0;text-align:center;color:var(--ink-2)}
.empty h2{color:var(--ink);font-size:22px;margin:16px 0 8px}
.empty p{margin:0 0 20px}
.drop{position:fixed;inset:12px;border:3px dashed var(--accent);border-radius:20px;background:color-mix(in srgb,var(--accent-soft) 80%,transparent);display:grid;place-items:center;font-weight:700;font-size:22px;color:var(--accent);z-index:50;pointer-events:none}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;margin-bottom:16px}
.search input{flex:1;border:0;background:none;outline:none;height:100%;font-size:16px}
.group{margin-bottom:22px}
.group h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px 4px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.row .sw{width:5px;align-self:stretch;border-radius:3px;flex:none;min-height:20px}
.row .body{flex:1;min-width:0}
.row .q{font:15px/1.4 var(--serif);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row .n{font-size:14px;color:var(--ink-2);margin-top:4px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row .s{font-size:12px;color:var(--ink-3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:3px;color:var(--accent);font-weight:600}
.badge svg.i{width:14px;height:14px}

/* account */
#btnSync.on{color:var(--accent)}
#btnSync.warn{color:var(--danger)}
#btnSync.busy{opacity:.55}
@media (prefers-reduced-motion:no-preference){#btnSync.busy svg{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{to{transform:translateY(-2px)}}}
.cover.nofile img{opacity:.45}
.cover.nofile .tag{background:var(--accent);color:var(--accent-ink)}

/* scrittura a mano */
.page canvas.ink{pointer-events:none;z-index:1}
#pdfScroll.pen .textLayer{pointer-events:none}
#pdfScroll.pen .page{touch-action:none;cursor:crosshair}
.inkbar{position:fixed;left:50%;bottom:calc(16px + var(--sb));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:6px 8px;max-width:calc(100vw - 20px);overflow-x:auto;-webkit-user-select:none;user-select:none}
.inkbar .sep,.padbar .sep{width:1px;height:26px;background:var(--line);margin:0 4px;flex:none}
.tl{min-width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--ink)}
.tl.on{background:var(--accent-soft);color:var(--accent)}
.tl.wide{padding:0 12px;font-weight:600;font-size:14px;white-space:nowrap}
.tl.acc{color:var(--accent)}
.tl.sz i{display:block;border-radius:50%}
.dot.sm{width:30px;height:30px;flex:none;border-width:3px}
.padwrap{position:relative;height:260px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;touch-action:none}
.padcv{position:absolute;left:0;top:0;touch-action:none}
.padbar{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.inkimg{display:block;max-width:100%;max-height:160px;background:#fff;border-radius:8px;margin-top:6px;border:1px solid var(--line)}
.mnode .inkimg{max-height:180px}

/* cartelle e riordino */
.shelfbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.crumb{padding:6px 10px;border-radius:10px;font-weight:700;font-size:17px;color:var(--ink-2)}
.crumb:last-child{color:var(--ink)}
.crumbs .gt{color:var(--ink-3)}
.crumb.drop-into{background:var(--accent-soft);color:var(--accent);outline:2px solid var(--accent)}
.tip{font-size:13px;color:var(--ink-3);margin:-6px 0 14px 2px}
.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card img{-webkit-user-drag:none;pointer-events:none}
.card.lifting{opacity:.25}
.card.ins-before::before,.card.ins-after::after{content:"";position:absolute;top:0;bottom:34px;width:4px;border-radius:2px;background:var(--accent)}
.card.ins-before::before{left:-11px}
.card.ins-after::after{right:-11px}
.card.drop-into .cover{outline:3px solid var(--accent);outline-offset:3px}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:rotate(-2.5deg) scale(1.05);opacity:.92;filter:drop-shadow(0 14px 24px rgba(0,0,0,.25))}
.cover.folder{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.cover.folder svg.i{width:64px;height:64px;stroke-width:1.3}
.cover.folder .cnt{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;font-weight:700}
.cover.mapc svg.prev{width:100%;height:100%}

/* lettore */
#readWrap{flex:1;position:relative;display:flex;min-height:0}
#pdfScroll{flex:1;overflow:auto;position:relative;background:var(--bg);touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
#pdfPages{transform-origin:0 0;padding:16px 0 calc(40px + var(--sb))}
.page{position:relative;margin:0 auto 14px;background:#fff;box-shadow:var(--shadow-s);overflow:hidden}
.page canvas{position:absolute;inset:0;display:block}
.hlLayer{position:absolute;inset:0;pointer-events:none}
.hlLayer .hl{position:absolute;mix-blend-mode:multiply;opacity:.5;border-radius:2px}
.hlLayer .hl.flash{outline:3px solid var(--accent);outline-offset:2px;opacity:.75}
.hlLayer .mark{position:absolute;right:6px;width:22px;height:30px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);opacity:.9}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-size-adjust:none;-webkit-text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%;-webkit-user-select:text;user-select:text}
.page{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.textLayer{-webkit-user-drag:none}
.ocrchip{position:absolute;top:12px;right:12px;z-index:3;display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;box-shadow:var(--shadow-s)}
.ocrchip svg.i{width:18px;height:18px}
.ocrpill{position:fixed;left:50%;top:calc(var(--bar) + var(--st) + 12px);transform:translateX(-50%);z-index:31;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
.ocrpill button{color:var(--hl-yellow);font-weight:700}
.textLayer ::selection{background:rgba(35,64,216,.28)}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:0;cursor:default;-webkit-user-select:none;user-select:none}
.textLayer.selecting .endOfContent{top:0}
.textLayer span{z-index:1}
#epubBox{flex:1;min-width:0;background:var(--paper)}
#epubBox .mg-ul rect{stroke:transparent!important}
#epubBox .mg-ul line{stroke:inherit!important;stroke-width:2.5px;stroke-opacity:1}
@media (prefers-color-scheme:dark){#epubBox{background:#16181C}}
#side{flex:none;width:340px;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
#side header{display:flex;align-items:center;padding:10px 12px 6px 16px;gap:8px}
#side header b{flex:1}
#side .scroll{padding:0 12px calc(16px + var(--sb))}
#side .row{border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:var(--surface)}
#side .row .q{-webkit-line-clamp:4}
@media (max-width:820px){
  #side{position:absolute;right:0;top:0;bottom:0;width:min(360px,92vw);box-shadow:var(--shadow);z-index:6}
}
#selBar{position:fixed;z-index:30;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;padding:6px 8px;-webkit-user-select:none;user-select:none}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c)}
.dot.u{background:var(--surface-2) linear-gradient(var(--c),var(--c)) 50% 72%/60% 4px no-repeat}
.seg svg.i{width:17px;height:17px;vertical-align:-3px}
.hlLayer .ul{position:absolute;height:3px;border-radius:2px;opacity:.95}
.hlLayer .ul.flash{outline:3px solid var(--accent);outline-offset:3px}
.dot.on{box-shadow:0 0 0 2px var(--ink)}
#selBar .sep{width:1px;height:26px;background:var(--line);margin:0 2px}
#selBar .tb{height:36px;padding:0 12px;border-radius:999px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--accent)}

/* mappa */
#mapStage{flex:1;position:relative;overflow:hidden;touch-action:none;background:
  radial-gradient(circle,var(--line) 1px,transparent 1.2px) 0 0/24px 24px,var(--bg);-webkit-user-select:none;user-select:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:-50000px;top:-50000px;width:100000px;height:100000px;overflow:visible;pointer-events:none}
#edges .e{stroke:var(--ink-3);stroke-width:2.2;fill:none}
#edges .e.sel{stroke:var(--accent);stroke-width:3.5}
#edges .hit{stroke:transparent;stroke-width:22;fill:none;pointer-events:stroke}
#edges text{font:600 13px var(--sans);fill:var(--ink-2);paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.mnode{position:absolute;transform:translate(-50%,-50%);width:240px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-s);padding:10px 12px 10px 16px;overflow:hidden;touch-action:none}
.mnode .bar-c{position:absolute;left:0;top:0;bottom:0;width:6px}
.mnode .q{font:14px/1.4 var(--serif);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.mnode .n{font-size:13px;color:var(--ink-2);margin-top:6px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mnode .src{font-size:11px;color:var(--ink-3);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnode.k-text{width:auto;min-width:120px;max-width:280px;padding:12px 16px}
.mnode.k-text .t{font-weight:600;font-size:15px;white-space:pre-wrap}
.mnode.k-page .p{display:flex;gap:8px;align-items:center;font-weight:600}
.mnode.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.mnode.src-link{border-color:var(--accent);border-style:dashed;border-width:2px}
.floatbar{position:absolute;left:50%;bottom:calc(18px + var(--sb));transform:translateX(-50%);display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow);max-width:calc(100vw - 24px);overflow-x:auto;z-index:4}
.floatbar .fb{height:44px;padding:0 14px;border-radius:12px;display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.floatbar .fb:active{background:var(--accent-soft)}
.floatbar .fb.acc{color:var(--accent)}
.floatbar .fb.dng{color:var(--danger)}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:4;white-space:nowrap}

/* fogli */
#sheetBack{position:fixed;inset:0;background:rgba(10,12,16,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){#sheetBack{align-items:center}}
.sheet{background:var(--surface);width:min(560px,100%);max-height:min(86vh,760px);border-radius:20px 20px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-bottom:var(--sb)}
@media (min-width:700px){.sheet{border-radius:20px;padding-bottom:0}}
.sheet>header{display:flex;align-items:center;padding:12px 10px 4px 20px;gap:8px}
.sheet>header b{flex:1;font-size:17px}
.sheet .sbody{overflow:auto;padding:6px 20px 20px}
.quote{font:16px/1.5 var(--serif);border-left:5px solid var(--hl-yellow);padding:4px 0 4px 14px;margin:6px 0 14px;white-space:pre-wrap;max-height:30vh;overflow:auto}
.lbl{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;margin:16px 0 8px}
textarea.note,input.txt{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;font-size:16px;outline:none}
textarea.note{min-height:120px;resize:vertical;line-height:1.45}
textarea.note:focus,input.txt:focus{border-color:var(--accent)}
.colors{display:flex;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.prow .body{flex:1;min-width:0}
.prow .q{font:14px/1.35 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.prow .lb{font-size:12px;color:var(--accent);font-weight:600}
.muted{color:var(--ink-3);font-size:14px}
.menu .mi{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-top:1px solid var(--line);font-weight:600;text-align:left}
.menu .mi:first-child{border-top:0}
.menu .mi small{display:block;font-weight:400;color:var(--ink-3);font-size:13px}

#toast{position:fixed;left:50%;bottom:calc(22px + var(--sb));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
#toast button{color:var(--hl-yellow);font-weight:700}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:0}}
}
</style>
</head>
<body>

<!-- LIBRERIA -->
<section id="v-lib" class="view">
  <header class="bar">
    <h1>Margini</h1>
    <div class="seg" id="tabs">
      <button data-tab="books" class="on">Libri</button>
      <button data-tab="notes">Appunti</button>
      <button data-tab="maps">Mappe</button>
    </div>
    <span class="spacer"></span>
    <button class="btn primary" id="btnImport"><svg class="i"><use href="#i-plus"/></svg><span>Importa</span></button>
    <button class="ib" id="btnSync" aria-label="Accedi per sincronizzare"><svg class="i"><use href="#i-cloud"/></svg></button>
    <button class="ib" data-reload aria-label="Ricarica e aggiorna"><svg class="i"><use href="#i-refresh"/></svg></button>
    <button class="ib" id="btnMenu" aria-label="Backup e impostazioni"><svg class="i"><use href="#i-more"/></svg></button>
  </header>
  <div class="scroll" id="libScroll"><div class="pad" id="libBody"></div></div>
</section>

<!-- LETTORE -->
<section id="v-read" class="view" hidden>
  <header class="bar">
    <button class="ib" id="readBack" aria-label="Indietro"><svg class="i"><use href="#i-back"/></svg></button>
    <div class="title" id="readTitle"></div>

<script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';

const APP_VERSION = '2.0';
// dentro l'app Android (Capacitor) alcune cose funzionano in modo diverso da Safari
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
// la versione per gli amici (/margini-app/) sta sullo stesso dominio della 1.9 personale: memorie separate
const NS = location.pathname.includes('/margini-app') ? 'margini-app' : 'margini';
const lsk = k => NS === 'margini' ? k : k.replace(/^mg-/, 'mga-');
/* ---------- utilità ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const trunc = (s, n) => (s = String(s || ''), s.length > n ? s.slice(0, n).trimEnd() + '…' : s);
const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const HEX = { yellow: '#FFD43B', green: '#4CD98A', blue: '#5AB4FA', pink: '#FF7AB8', orange: '#FF9F43', purple: '#A78BFA' };
const COLOR_KEYS = Object.keys(HEX);
const fmtMB = b => (b / 1048576).toFixed(b > 104857600 ? 0 : 1) + ' MB';
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- database locale (IndexedDB) ---------- */
const STORES = ['books', 'files', 'hls', 'nodes', 'links', 'maps', 'folders', 'inks', 'ocr'];
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(NS, 4);
    r.onupgradeneeded = () => { const d = r.result; for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); };
    r.onsuccess = () => { db = r.result; db.onversionchange = () => { db.close(); location.reload(); }; res(); };
    r.onblocked = () => { document.body.insertAdjacentHTML('beforeend', '<div id="dbwait" style="position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:99;padding:24px;text-align:center;font-weight:600">Sto aggiornando Margini. Se resta qui, chiudi le altre finestre aperte di Margini.</div>'); };
    r.onerror = () => rej(r.error);
  });
}
const wrap = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const os = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
const dbPut = (s, v) => wrap(os(s, 'readwrite').put(v));
const dbGet = (s, id) => wrap(os(s).get(id));
const dbDel = (s, id) => wrap(os(s, 'readwrite').delete(id));
const dbAll = s => wrap(os(s).getAll());

const S = { books: [], hls: [], nodes: [], links: [], maps: [], folders: [], inks: [], ocr: [] };
const SYNC_STORES = ['books', 'hls', 'nodes', 'links', 'maps', 'folders', 'inks'];
let FILES = new Set();
async function loadAll() {
  for (const k of Object.keys(S)) S[k] = await dbAll(k);
  FILES = new Set(await wrap(os('files').getAllKeys()));
}
async function save(store, obj) {
  if (SYNC_STORES.includes(store)) obj._u = Date.now();
  await dbPut(store, obj);
  markDirty(store, obj.id, false);
  const a = S[store], i = a.findIndex(x => x.id === obj.id);
  if (i < 0) a.push(obj); else a[i] = obj;
}
async function remove(store, id) { await dbDel(store, id); S[store] = S[store].filter(x => x.id !== id); markDirty(store, id, true); }

/* ---------- elementi (sottolineature, pagine segnate, note libere) ---------- */
const itemById = id => S.hls.find(x => x.id === id) || S.nodes.find(x => x.id === id);
const kindOf = it => it.kind || 'hl';
const bookOf = it => it && S.books.find(b => b.id === it.bookId);
const linksOf = id => S.links.filter(l => l.a === id || l.b === id);
const otherEnd = (l, id) => l.a === id ? l.b : l.a;
function locLabel(it) {
  if (!it.loc) return '';
  if (it.loc.page) return 'p. ' + it.loc.page;
  return it.loc.label || '';
}
function itemTitle(it) {
  const k = kindOf(it);
  if (k === 'hl') return it.text;
  if (k === 'page') return it.text || ('Pagina ' + locLabel(it));
  return it.text || (it.inkImg ? 'Nota a mano' : 'Nota');
}
function itemSrc(it) {
  const b = bookOf(it);
  if (!b) return kindOf(it) === 'text' ? 'Nota libera' : '';
  return [b.title, locLabel(it)].filter(Boolean).join(' · ');
}
async function deleteItem(id) {
  const it = itemById(id); if (!it) return;
  await remove(kindOf(it) === 'hl' ? 'hls' : 'nodes', id);
  for (const l of linksOf(id)) await remove('links', l.id);
  for (const m of S.maps) if (m.pos[id]) { delete m.pos[id]; await save('maps', m); }
}
async function linkItems(a, b, label = '') {
  if (a === b) return;
  if (S.links.some(l => (l.a === a && l.b === b) || (l.a === b && l.b === a))) { toast('Sono già collegati'); return; }
  await save('links', { id: uid(), a, b, label, created: Date.now() });
}

/* ---------- toast e fogli ---------- */
let toastT;
function toast(msg, action, fn, ms = 3200) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.hidden = true; fn(); };
  t.hidden = false; clearTimeout(toastT);
  if (ms) toastT = setTimeout(() => t.hidden = true, ms);
}
let sheetClose = null;
function openSheet(title, html, onClose) {
  const back = $('#sheetBack');
  back.innerHTML = `<div class="sheet" role="dialog"><header><b>${esc(title)}</b><button class="ib" data-x aria-label="Chiudi">${ic('x')}</button></header><div class="sbody">${html}</div></div>`;
  back.hidden = false;
  const el = back.firstElementChild;
  const close = () => { if (back.hidden) return; back.hidden = true; back.innerHTML = ''; sheetClose = null; onClose && onClose(); };
  sheetClose = close;
  el.querySelector('[data-x]').onclick = close;
  back.onpointerdown = e => { if (e.target === back) close(); };
  return el;
}
const closeSheet = () => sheetClose && sheetClose();
function askText(title, value = '', { multiline = false, ok = 'Salva', placeholder = '' } = {}) {
  return new Promise(res => {
    let done = false;
    const field = multiline
      ? `<textarea class="note" id="askF" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`
      : `<input class="txt" id="askF" value="${esc(value)}" placeholder="${esc(placeholder)}">`;
    const el = openSheet(title, `${field}<div class="actions"><button class="btn primary" id="askOk">${esc(ok)}</button></div>`, () => { if (!done) res(null); });
    const f = $('#askF', el);
    const fin = () => { done = true; const v = f.value.trim(); closeSheet(); res(v); };
    $('#askOk', el).onclick = fin;
    if (!multiline) f.onkeydown = e => { if (e.key === 'Enter') fin(); };
    setTimeout(() => { f.focus(); f.select && !multiline && f.select(); }, 60);
  });
}
function askConfirm(title, text, ok = 'Elimina') {
  return new Promise(res => {
    let done = false;
    const el = openSheet(title, `<p style="margin:4px 0 0">${esc(text)}</p><div class="actions"><button class="btn danger" id="cOk">${esc(ok)}</button><button class="btn" id="cNo">Annulla</button></div>`, () => { if (!done) res(false); });
    $('#cOk', el).onclick = () => { done = true; closeSheet(); res(true); };
    $('#cNo', el).onclick = () => closeSheet();
  });
}

/* ---------- navigazione ---------- */
let view = 'lib';
const back = [];
function here() {
  if (view === 'read' && R.book) return { v: 'read', id: R.book.id };
  if (view === 'map' && M.map) return { v: 'map', id: M.map.id };
  return { v: 'lib' };
}
function go(v, push = true) {
  if (push && view !== v) { back.push(here()); if (back.length > 40) back.shift(); }
  if (view === 'read' && v !== 'read') closeReader();
  view = v;
  for (const n of ['lib', 'read', 'map']) $('#v-' + n).hidden = n !== v;
  hideSelBar();
  if (v === 'lib') renderLib();
}
function goBack() {
  if (sheetClose) closeSheet();
  try { getSelection().removeAllRanges(); } catch {}
  const p = back.pop() || { v: 'lib' };
  if (p.v === 'read' && S.books.some(b => b.id === p.id)) openBook(p.id, null, false);
  else if (p.v === 'map' && S.maps.some(m => m.id === p.id)) openMap(p.id, null, false);
  else go('lib', false);
}

/* ---------- import ---------- */
const cleanTitle = n => n.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
async function importFiles(list) {
  const files = [...list]; if (!files.length) return;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const res = { added: 0, skipped: [], dup: 0, restored: false };
  let i = 0;
  for (const f of files) {
    i++; toast(`Importo ${i} di ${files.length}…`, null, null, 0);
    try { await importOne(f.name, f, res); }
    catch (e) { console.error(e); res.skipped.push(f.name + ' (errore)'); }
  }
  renderLib();
  const parts = [];
  if (res.restored) parts.push('Backup ripristinato');
  if (res.added) parts.push(`${res.added} ${res.added === 1 ? 'libro aggiunto' : 'libri aggiunti'}`);
  if (res.dup) parts.push(`${res.dup} già presenti`);
  if (res.skipped.length) {
    toast(parts.concat(`${res.skipped.length} non supportati`).join(' · '), 'Dettagli', () => {
      openSheet('File non importati', `<p class="muted">Margini apre PDF ed EPUB. Questi file hanno un altro formato:</p><div class="list">${res.skipped.map(s => `<div class="row"><div class="body">${esc(s)}</div></div>`).join('')}</div>`);
    }, 9000);
  } else toast(parts.join(' · ') || 'Nessun file importato');
}
async function importOne(name, blob, res, depth = 0) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const base = name.split('/').pop();
  if (ext === 'pdf' || ext === 'epub') return addBook(base, blob, ext, res);
  if (ext === 'json') {
    const data = JSON.parse(await blob.text());
    if (data && data.app === 'margini') { await restoreBackup(data, null); res.restored = true; return; }
    res.skipped.push(base); return;
  }
  if (ext === 'zip' && depth < 3) {
    const z = await JSZip.loadAsync(blob);
    const bk = z.file('margini-backup.json');
    if (bk) { await restoreBackup(JSON.parse(await bk.async('string')), z); res.restored = true; return; }
    const entries = Object.values(z.files).filter(e => !e.dir && !/(^|\/)(__MACOSX|\.)/.test(e.name));
    for (const e of entries) {
      const x = (e.name.split('.').pop() || '').toLowerCase();
      if (['pdf', 'epub', 'zip'].includes(x)) await importOne(e.name, await e.async('blob'), res, depth + 1);
      else res.skipped.push(e.name.split('/').pop() + '  (dentro ' + base + ')');
    }
    return;
  }
  res.skipped.push(base);
}
async function addBook(name, blob, type, res) {
  const title = cleanTitle(name);
  const orphan = (ATTACH && S.books.find(b => b.id === ATTACH && b.type === type)) || S.books.find(b => !FILES.has(b.id) && b.type === type && b.size === blob.size);
  if (orphan) {
    ATTACH = null;
    await dbPut('files', { id: orphan.id, blob: new Blob([await blob.arrayBuffer()], { type: type === 'pdf' ? 'application/pdf' : 'application/epub+zip' }) });
    FILES.add(orphan.id);
    if (!orphan.cover) { try { orphan.cover = await makeCover(blob, type); await save('books', orphan); } catch {} }
    res.added++; return;
  }
  if (S.books.some(b => b.title === title && b.size === blob.size)) { res.dup++; return; }
  const id = uid();
  const data = new Blob([await blob.arrayBuffer()], { type: type === 'pdf' ? 'application/pdf' : 'application/epub+zip' });
  await dbPut('files', { id, blob: data }); FILES.add(id);
  const book = { id, title, type, size: data.size, added: Date.now(), opened: 0, pos: null, zoom: 1, font: 100, cover: null, folder: curFolder.books, order: topOrder('books', curFolder.books) };
  try { book.cover = await makeCover(data, type); } catch (e) { console.warn('copertina', e); }
  await save('books', book);
  res.added++;
}
let ATTACH = null;
async function makeCover(blob, type) {
  const cv = document.createElement('canvas');
  if (type === 'pdf') {
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
    const p = await doc.getPage(1); const v0 = p.getViewport({ scale: 1 });
    const vp = p.getViewport({ scale: 300 / v0.width });
    cv.width = vp.width; cv.height = vp.height;
    await p.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    doc.destroy();
    return cv.toDataURL('image/jpeg', .72);
  }
  const b = ePub(await blob.arrayBuffer());
  await b.ready;
  const url = await b.coverUrl();
  let out = null;
  if (url) {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const w = 300, h = Math.round(img.naturalHeight * w / img.naturalWidth) || 420;
    cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
    out = cv.toDataURL('image/jpeg', .72);
  }
  b.destroy();
  return out;
}

/* ---------- backup ---------- */
async function restoreBackup(data, zip) {
  for (const k of ['books', 'hls', 'nodes', 'links', 'maps', 'folders', 'inks', 'ocr']) for (const r of (data[k] || [])) await dbPut(k, r);
  if (zip) for (const b of (data.books || [])) {
    const f = zip.file(`files/${b.id}.${b.type}`);
    if (f) await dbPut('files', { id: b.id, blob: new Blob([await f.async('arraybuffer')], { type: b.type === 'pdf' ? 'application/pdf' : 'application/epub+zip' }) });
  }
  await loadAll();
  if (SYNC.user) { markAllDirty(); scheduleSync(1000); }
}
async function exportBackup(withBooks) {
  closeSheet();
  const stamp = new Date().toISOString().slice(0, 10);
  const data = { app: 'margini', v: 1, date: new Date().toISOString(), ...S };
  let blob, name;
  if (withBooks) {
    toast('Preparo il backup…', null, null, 0);
    const z = new JSZip();
    z.file('margini-backup.json', JSON.stringify(data));

function blobToB64(b) {
  return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => ko(r.error); r.readAsDataURL(b); });
}
// nell'app: il file si scrive a pezzi nella cache e si apre la condivisione di Android
async function nativeShare(blob, name) {
  const { Filesystem, Share } = window.Capacitor.Plugins;
  const path = 'export/' + name, CH = 3 * 1024 * 1024;
  for (let off = 0, first = true; first || off < blob.size; off += CH, first = false) {
    const data = await blobToB64(blob.slice(off, off + CH));
    if (first) await Filesystem.writeFile({ path, data, directory: 'CACHE', recursive: true });
    else await Filesystem.appendFile({ path, data, directory: 'CACHE' });
    toast(`Preparo il file… ${Math.min(100, Math.round((off + CH) / Math.max(1, blob.size) * 100))}%`, null, null, 0);
  }
  const { uri } = await Filesystem.getUri({ path, directory: 'CACHE' });
  $('#toast').hidden = true;
  await Share.share({ title: name, files: [uri], dialogTitle: 'Salva o invia il backup' });
}
async function shareOrDownload(blob, name) {
  if (NATIVE) {
    try { await nativeShare(blob, name); toast('Backup pronto'); }
    catch (e) { if (!/cancel/i.test(String(e && e.message))) { console.error(e); toast('Esportazione non riuscita'); } else $('#toast').hidden = true; }
    return;
  }
  const file = new File([blob], name, { type: blob.type || 'application/octet-stream' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); toast('Backup pronto'); return; }
    catch (e) { if (e.name === 'AbortError') { $('#toast').hidden = true; return; } }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  toast('Backup scaricato: ' + name);
}

const curFolder = { books: null, maps: null };

const recency = x => x.opened || x.updated || x.added || x.created || 0;
const folderById = id => S.folders.find(f => f.id === id);
function entriesOf(t, parent) {
  const fs = S.folders.filter(f => f.tab === t && (f.parent || null) === parent).map(f => ({ kind: 'folder', obj: f }));
  const xs = S[t].filter(x => (x.folder || null) === parent).map(x => ({ kind: t === 'books' ? 'book' : 'map', obj: x }));
  return [...fs, ...xs];
}
function sortedEntries(t, parent) {
  return entriesOf(t, parent).sort((a, b) => {
    const ao = a.obj.order, bo = b.obj.order;
    if (ao != null && bo != null) return ao - bo;
    if (ao != null) return -1;
    if (bo != null) return 1;
    if ((a.kind === 'folder') !== (b.kind === 'folder')) return a.kind === 'folder' ? -1 : 1;
    return recency(b.obj) - recency(a.obj);

function mapPreview(m) {

(() => {

  const clearMarks = () => $$('.ins-before,.ins-after,.drop-into', body).forEach(x => x.classList.remove('ins-before', 'ins-after', 'drop-into'));
  body.addEventListener('click', e => {
    if (DnD.suppress) { DnD.suppress = false; e.stopPropagation(); e.preventDefault(); return; }
    const crumb = e.target.closest('[data-crumb]');
    if (crumb) { curFolder[body.dataset.tab] = crumb.dataset.crumb || null; renderLib(); return; }
    const card = e.target.closest('.card[data-kind]'); if (!card) return;
    const en = entryOf(card.dataset.kind, card.dataset.id); if (!en) return;
    if (e.target.closest('[data-more]')) entryMenu(en);
    else if (e.target.closest('[data-open]')) openEntry(en);
  }, true);
  body.addEventListener('pointerdown', e => {
    if (e.button > 0 || tab === 'notes') return;
    const card = e.target.closest('.card[data-kind]');
    if (!card || e.target.closest('[data-more]')) return;
    DnD.start = { x: e.clientX, y: e.clientY, card, id: e.pointerId };
    clearTimeout(DnD.timer);
    DnD.timer = setTimeout(() => beginDrag(e.clientX, e.clientY), 380);
  });
  function beginDrag() {
    const s = DnD.start; if (!s) return;
    const r = s.card.getBoundingClientRect();
    const g = s.card.cloneNode(true);
    g.classList.add('ghost'); g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
    document.body.appendChild(g);
    s.card.classList.add('lifting');
    DnD.drag = { card: s.card, ghost: g, dx: s.x - r.left, dy: s.y - r.top, moved: false, target: null };
    try { getSelection().removeAllRanges(); } catch {}
  }
  function onMove(x, y) {
    const d = DnD.drag;
    if (!d) {
      if (DnD.start && Math.hypot(x - DnD.start.x, y - DnD.start.y) > 8) { clearTimeout(DnD.timer); DnD.start = null; }
      return;
    }
    if (Math.hypot(x - DnD.start.x, y - DnD.start.y) > 6) d.moved = true;
    d.ghost.style.left = (x - d.dx) + 'px'; d.ghost.style.top = (y - d.dy) + 'px';
    const sr = sc.getBoundingClientRect();
    if (y < sr.top + 70) sc.scrollTop -= 14; else if (y > sr.bottom - 70) sc.scrollTop += 14;
    clearMarks(); d.target = null;
    const el = document.elementFromPoint(x, y); if (!el) return;
    const crumb = el.closest('[data-crumb]');
    const cur = curFolder[body.dataset.tab] || '';
    if (crumb && crumb.dataset.crumb !== cur) { crumb.classList.add('drop-into'); d.target = { mode: 'into', folder: crumb.dataset.crumb || null }; return; }
    const tc = el.closest('.card[data-kind]');
    if (!tc || tc === d.card) return;
    const r = tc.getBoundingClientRect();
    const fx = (x - r.left) / r.width, fy = (y - r.top) / r.height;
    if (tc.dataset.kind === 'folder' && fx > .2 && fx < .8 && fy < .8) {
      tc.classList.add('drop-into'); d.target = { mode: 'into', folder: tc.dataset.id };
    } else {
      const after = fx > .5;
      tc.classList.add(after ? 'ins-after' : 'ins-before');
      d.target = { mode: after ? 'after' : 'before', id: tc.dataset.id, kind: tc.dataset.kind };
    }
  }
  async function end(cancel) {
    clearTimeout(DnD.timer);
    const d = DnD.drag, s = DnD.start;
    DnD.drag = null; DnD.start = null;
    if (!d) return;
    d.ghost.remove(); d.card.classList.remove('lifting'); clearMarks();
    DnD.suppress = true; setTimeout(() => DnD.suppress = false, 400);
    const t = body.dataset.tab;
    const me = entryOf(d.card.dataset.kind, d.card.dataset.id); if (!me) return;
    if (!d.moved && !cancel) { entryMenu(me); return; }
    if (cancel || !d.target) return;

    const list = sortedEntries(t, curFolder[t]).filter(x => x.obj.id !== me.obj.id);
    let i = list.findIndex(x => x.obj.id === d.target.id);

function centerOn(p) {

  const y1 = Math.min(...ps.map(p => p.y)) - 120, y2 = Math.max(...ps.map(p => p.y)) + 120;

  cv.addEventListener('pointermove', e => {
    const c = st.cur; if (!c || c.pid !== e.pointerId) return;
    e.preventDefault();
    for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) { const p = pt(ev); if (c.er) erase(p); else c.s.p.push(p[0], p[1]); }
    if (!c.er) paint();
  });
  const up = e => {
    const c = st.cur; if (!c || c.pid !== e.pointerId) return;
    st.cur = null;
    if (c.er) { if (c.removed.length) st.undo.push({ er: c.removed }); }
    else st.undo.push({ add: c.s });
    commit();
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  host.querySelector('.padbar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.pc) { st.color = b.dataset.pc; st.tool = 'pen'; }
    if (b.dataset.pt === 'er') st.tool = st.tool === 'er' ? 'pen' : 'er';
    if (b.dataset.pt === 'undo') { const u = st.undo.pop(); if (u) { if (u.add) st.strokes = st.strokes.filter(s => s !== u.add); else st.strokes.push(...u.er); paint(); commit(); } }
    if (b.dataset.pt === 'clear' && st.strokes.length) { st.undo.push({ er: st.strokes }); st.strokes = []; paint(); commit(); }
    $$('[data-pc]', host).forEach(x => x.classList.toggle('on', st.tool === 'pen' && x.dataset.pc === st.color));
    $('[data-pt=er]', host).classList.toggle('on', st.tool === 'er');
  });
}

/* ---------- riconoscimento del testo (OCR) per i PDF scansionati, tutto sul dispositivo ---------- */
const OCR = { worker: null, loading: null, job: null, warned: new Set() };
const ocrId = n => R.book.id + ':' + n;
function ocrWorker() {
  if (OCR.worker) return Promise.resolve(OCR.worker);
  if (!OCR.loading) {
    const base = new URL('vendor/tesseract/', location.href).href;
    OCR.loading = Tesseract.createWorker('ita', 1, {
      workerPath: base + 'worker.min.js', corePath: base, langPath: base + 'lang',
      workerBlobURL: false, gzip: true, cacheMethod: 'none'
    }).then(w => (OCR.worker = w)).catch(e => { OCR.loading = null; throw e; });
  }
  return OCR.loading;
}
async function pageHasText(n) {
  const tc = await (await R.pdf.getPage(n)).getTextContent();
  return tc.items.some(i => i.str && i.str.trim());
}
async function ocrPage(n) {
  const w = await ocrWorker();
  const page = await R.pdf.getPage(n);
  const v0 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: Math.min(3, 1800 / v0.width) });
  const cv = document.createElement('canvas');
  cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
  await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  const { data } = await w.recognize(cv, {}, { blocks: true, text: false, hocr: false, tsv: false });
  const W = cv.width, H = cv.height, lines = [];
  for (const b of data.blocks || []) for (const p of b.paragraphs || []) for (const l of p.lines || []) {
    const ws = (l.words || []).filter(x => x.text && x.text.trim() && x.confidence > 20)
      .map(x => [x.text.trim(), +(x.bbox.x0 / W).toFixed(5), +(x.bbox.y0 / H).toFixed(5), +((x.bbox.x1 - x.bbox.x0) / W).toFixed(5), +((x.bbox.y1 - x.bbox.y0) / H).toFixed(5)]);
    if (ws.length) lines.push(ws);
  }
  cv.width = cv.height = 0;
  const rec = { id: ocrId(n), bookId: R.book.id, page: n, lines };
  await save('ocr', rec);
  return rec;
}
const measureCtx = document.createElement('canvas').getContext('2d');
function buildOcrLayer(tl, rec, W, H) {
  tl.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const line of rec.lines) {
    // altezza della riga uguale per tutte le parole: la selezione resta pulita
    const top = Math.min(...line.map(w => w[2])), bot = Math.max(...line.map(w => w[2] + w[4]));
    const fs = Math.max(4, (bot - top) * H * .9);
    measureCtx.font = `${fs}px sans-serif`;
    line.forEach(([t, x, , w], i) => {
      const s = document.createElement('span');
      s.textContent = t + (i < line.length - 1 ? ' ' : '\n');
      s.style.cssText = `left:${x * W}px;top:${top * H}px;font-size:${fs}px;font-family:sans-serif`;
      const mw = measureCtx.measureText(t).width || 1;
      s.style.transform = `scaleX(${(w * W) / mw})`;
      frag.appendChild(s);
    });
  }
  tl.appendChild(frag);
  addEndOfContent(tl);
}
// chiamata da renderPage quando una pagina non ha testo
function scannedPage(n, tl, vp) {
  const rec = S.ocr.find(x => x.id === ocrId(n));
  if (rec) { buildOcrLayer(tl, rec, vp.width, vp.height); return; }
  const P = R.pages[n];
  if (!P.el.querySelector('.ocrchip')) {
    const b = document.createElement('button');
    b.className = 'ocrchip'; b.innerHTML = `${ic('scan')} Riconosci testo`;
    b.onclick = e => { e.stopPropagation(); ocrMenu(n); };
    P.el.appendChild(b);
  }
  if (!OCR.warned.has(R.book.id) && !OCR.job) {
    OCR.warned.add(R.book.id);
    toast('Questo PDF è una scansione: per evidenziare serve riconoscere il testo', 'Riconosci', () => ocrMenu(n), 9000);
  }
}
function refreshPageText(n) {
  const P = R.pages[n]; if (!P || !P.on) return;
  const tl = P.el.querySelector('.textLayer'), rec = S.ocr.find(x => x.id === ocrId(n));
  if (!tl || !rec) return;
  const chip = P.el.querySelector('.ocrchip'); if (chip) chip.remove();
  buildOcrLayer(tl, rec, parseFloat(P.el.style.width), parseFloat(P.el.style.height));
}
function ocrMenu(n) {
  if (OCR.job) { toast('Riconoscimento già in corso'); return; }
  const total = R.pdf.numPages;
  const el = openSheet('Riconosci il testo', `<p style="margin:0 0 6px">Questa pagina è un'immagine: per poterla evidenziare, l'app deve leggere il testo. Lo fa sul tuo iPad, senza mandare niente fuori.</p>
    <p class="muted" style="margin:0">La prima volta prepara il riconoscimento (circa 9 MB). Ogni pagina richiede qualche secondo e resta salvata.</p>
    <div class="menu" style="margin-top:12px">
      <button class="mi" data-a="one">${ic('scan')}<span>Solo questa pagina<small>Pagina ${n}</small></span></button>
      <button class="mi" data-a="all">${ic('scan')}<span>Tutto il libro<small>${total} pagine · puoi continuare a leggere mentre lavora</small></span></button>
    </div>`);
  el.querySelector('[data-a=one]').onclick = () => { closeSheet(); runOcr([n]); };
  el.querySelector('[data-a=all]').onclick = () => {
    closeSheet();
    const pages = [n]; for (let i = 1; i <= total; i++) if (i !== n) pages.push(i);
    runOcr(pages, true);
  };
}
async function runOcr(pages, checkText) {
  const book = R.book, job = OCR.job = { stop: false, done: 0, total: pages.length, book: book.id };
  const pill = $('#ocrPill');
  const show = msg => { pill.hidden = false; pill.innerHTML = `<span>${esc(msg)}</span><button>Ferma</button>`; pill.querySelector('button').onclick = () => { job.stop = true; show('Mi fermo dopo questa pagina…'); }; };
  show('Preparo il riconoscimento del testo…');
  try {
    await ocrWorker();
    for (const n of pages) {
      if (job.stop || R.book !== book) break;
      job.done++;
      if (S.ocr.some(x => x.id === ocrId(n))) continue;
      if (checkText && await pageHasText(n)) continue;
      show(pages.length === 1 ? `Leggo la pagina ${n}…` : `Leggo il testo: pagina ${job.done} di ${job.total}`);
      await ocrPage(n);
      if (R.book === book) refreshPageText(n);
    }
    toast(job.stop || R.book !== book ? 'Riconoscimento fermato: riprendi quando vuoi' : pages.length === 1 ? 'Testo riconosciuto: ora puoi selezionarlo' : 'Testo riconosciuto in tutto il libro');
  } catch (e) {
    console.error(e);
    toast(R.book !== book ? 'Riconoscimento fermato: riprendi quando vuoi' : 'Riconoscimento non riuscito. Serve internet la prima volta.');
  } finally {
    OCR.job = null; pill.hidden = true;
  }
}

async function pushOutbox(sb) {
  const snap = loadOutbox(), keys = Object.keys(snap);
  if (!keys.length) return;
  const rows = keys.map(k => {
    const { store, id, del } = snap[k];
    const obj = del ? null : S[store].find(x => x.id === id);
    return { user_id: SYNC.user.id, store, id, data: obj ? JSON.parse(JSON.stringify(obj)) : null, deleted: del || !obj };
  });

    if (error) throw error;

async function pullChanges(sb) {
  const since = lsGet(sinceKey(), '') || '1970-01-01T00:00:00Z';
  // margine di 5 secondi: le righe salvate nello stesso istante non vanno perse
  const from = new Date(new Date(since).getTime() - 5000).toISOString();
  let max = since, changed = 0, page = 0;
  const pending = loadOutbox();
  for (;;) {
    const { data, error } = await sb.from('records').select('store,id,data,deleted,updated_at')
      .gt('updated_at', from).order('updated_at', { ascending: true }).range(page * 500, page * 500 + 499);
    if (error) throw error;
    for (const r of data) {
      if (r.updated_at > max) max = r.updated_at;
      if (pending[r.store + '|' + r.id]) continue;
      if (await applyRemote(r)) changed++;
    }
    if (data.length < 500) break;
    page++;
  }
  lsSet(sinceKey(), max);
  return changed;
}
async function applyRemote(r) {
  if (!SYNC_STORES.includes(r.store)) return false;
  const arr = S[r.store], i = arr.findIndex(x => x.id === r.id);
  if (r.deleted || !r.data) {
    if (i < 0) return false;
    await dbDel(r.store, r.id); arr.splice(i, 1);
    if (r.store === 'books') { await dbDel('files', r.id); FILES.delete(r.id); }
    return true;
  }
  if (i >= 0 && (arr[i]._u || 0) >= (r.data._u || 0)) return false;
  await dbPut(r.store, r.data);
  if (i >= 0) arr[i] = r.data; else arr.push(r.data);
  return true;
}

  openItemSheet(nd.id, 'pad');
};
$('#btnSide').onclick = () => { const s = $('#side'); s.hidden = !s.hidden; $('#btnSide').classList.toggle('on', !s.hidden); if (!s.hidden) renderSide(); if (R.kind === 'pdf') setTimeout(() => setZoom(R.book.zoom || 1), 30); };
$('#sideClose').onclick = () => { $('#side').hidden = true; $('#btnSide').classList.remove('on'); if (R.kind === 'pdf') setTimeout(() => setZoom(R.book.zoom || 1), 30); };
$('#zIn').onclick = () => { if (R.kind === 'pdf') setZoom((R.book.zoom || 1) * 1.2); else epubFont(10); };
$('#zOut').onclick = () => { if (R.kind === 'pdf') setZoom((R.book.zoom || 1) / 1.2); else epubFont(-10); };
function epubFont(d) { R.book.font = Math.min(200, Math.max(70, (R.book.font || 100) + d)); save('books', R.book); R.rendition && R.rendition.themes.fontSize(R.book.font + '%'); }
$('#pageInfo').onclick = async () => {
  if (R.kind === 'pdf') {
    const t = await askText(`Vai alla pagina (1 a ${R.pdf.numPages})`, String(R.cur), { ok: 'Vai' });
    const n = parseInt(t, 10); if (n) scrollToPdf(n, 0);
  } else if (R.kind === 'epub' && R.toc.length) {
    const el = openSheet('Indice', `<div class="menu">${R.toc.map((t, i) => `<button class="mi" data-t="${i}"><span>${esc(t.label.trim())}</span></button>`).join('')}</div>`);
    $$('[data-t]', el).forEach(b => b.onclick = () => { closeSheet(); R.rendition.display(R.toc[+b.dataset.t].href); });
  }
};
let lastW = innerWidth;
addEventListener('resize', debounce(() => {
  if (Math.abs(innerWidth - lastW) < 20) return; lastW = innerWidth;
  if (view === 'read' && R.kind === 'pdf') setZoom(R.book.zoom || 1);
}, 250));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyEpubTheme);
addEventListener('keydown', e => { if (e.key === 'Escape') { if (sheetClose) closeSheet(); else hideSelBar(); } });
// trascina file (comodo dal PC)
let dragN = 0, innerDrag = false;
addEventListener('dragstart', () => { innerDrag = true; });
addEventListener('dragend', () => { innerDrag = false; });
const outerFiles = e => !innerDrag && view === 'lib' && e.dataTransfer && [...e.dataTransfer.types].includes('Files');
addEventListener('dragenter', e => { if (outerFiles(e)) { dragN++; $('#drop').hidden = false; } });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#drop').hidden = true; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragN = 0; $('#drop').hidden = true;
  const ok = outerFiles(e); innerDrag = false;
  if (ok && e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
});

/* ---------- avvio ---------- */
(async () => {
  try { await openDB(); await loadAll(); const w = document.getElementById('dbwait'); if (w) w.remove(); }
  catch (e) { document.body.innerHTML = '<p style="padding:24px">Impossibile aprire la memoria locale. Se sei in navigazione privata, aprila in una scheda normale.</p>'; return; }
  renderLib();
  try {
    const r = JSON.parse(lsGet('mg-resume', 'null')); lsSet('mg-resume', 'null');
    if (r && Date.now() - r.t < 120000) {
      if (r.v === 'read' && S.books.some(b => b.id === r.id)) openBook(r.id, null, true);
      else if (r.v === 'map' && S.maps.some(m => m.id === r.id)) openMap(r.id, null, true);
      else if (r.tab) { tab = r.tab; renderLib(); }
    }
  } catch {}
  if (NATIVE) $('#fileIn').removeAttribute('accept');
  try { initSync(); } catch (e) { console.error(e); }
  if (!NATIVE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing; if (!w) return;
        w.addEventListener('statechange', () => {
          if (w.state !== 'activated' || !navigator.serviceWorker.controller) return;
          // avviso solo se la pagina sul server è davvero più nuova di quella aperta
          fetch('./?v=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(h => {
            const m = h.match(/APP_VERSION = '([^']+)'/);
            if (m && m[1] !== APP_VERSION) toast('Nuova versione di Margini pronta', 'Aggiorna', reloadApp, 0);
          }).catch(() => {});
        });
      });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  }
})();
</script>
</body>
